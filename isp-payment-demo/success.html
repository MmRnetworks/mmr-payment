<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payment Confirmation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      /* modern ISP-style gradient background */
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
      color: white;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 35px;
      border-radius: 16px;
      text-align: center;
      width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .icon {
      font-size: 50px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 10px 0;
      font-size: 22px;
      font-weight: 700;
    }

    p {
      font-size: 14px;
      opacity: 0.9;
      line-height: 1.5;
    }

    .success {
      color: #22c55e;
      font-weight: 700;
      font-size: 18px;
      margin-top: 10px;
    }

    .button {
      margin-top: 20px;
      display: inline-block;
      padding: 10px 16px;
      border-radius: 10px;
      background: #22c55e;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    .button:hover {
      background: #16a34a;
    }

    .small {
      margin-top: 12px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="icon">🎉</div>

  <h2>Payment Successful</h2>

  <div class="success" id="result"></div>

  <p>
    Congratulations! Your payment has been processed successfully.
  </p>
  
  <a href="index.html" class="button">Back to Dashboard</a>

  <div class="small">
    This is an automated confirmation message.
  </div>

</div>

<script>
const status = localStorage.getItem("status");

if (status === "paid") {
  document.getElementById("result").innerText =
    ;
} else {
  document.getElementById("result").innerText =
    "No active transaction found.";
}
</script>

</body>
</html>
