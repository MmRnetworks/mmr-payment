<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Secure Checkout</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: radial-gradient(circle at top, #0f172a, #020617);
      color: white;
    }

    .box {
      width: 380px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .badge {
      display: inline-block;
      background: rgba(34,197,94,0.15);
      color: #22c55e;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    h2 {
      margin: 10px 0 5px;
      font-size: 20px;
      font-weight: 700;
    }

    .subtext {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 20px;
    }

    .info {
      background: rgba(255,255,255,0.06);
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .amount {
      font-size: 30px;
      font-weight: 700;
      color: #22c55e;
      margin: 15px 0;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .pay {
      background: #22c55e;
      color: white;
    }

    .pay:hover {
      background: #16a34a;
      transform: translateY(-1px);
    }

    .cancel {
      background: rgba(255,255,255,0.1);
      color: white;
    }

    .cancel:hover {
      background: rgba(255,255,255,0.2);
    }

    .footer {
      margin-top: 15px;
      font-size: 11px;
      opacity: 0.6;
    }

    .lock {
      font-size: 12px;
      opacity: 0.7;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

<div class="box">

  <div class="lock">🔒 Encrypted Payment Session</div>

  <h2>Checkout</h2>
  

  <div class="info" id="info"></div>

  <div class="amount" id="amount"></div>

  <div class="buttons">
    <button class="pay" onclick="pay()">Pay Now</button>
    <button class="cancel" onclick="cancel()">Cancel</button>
  </div>

  <div class="footer">
    Powered by Xendit
  </div>

</div>

<script>
const data = JSON.parse(localStorage.getItem("payment"));

if (!data) {
  document.body.innerHTML = "<h2>No payment session found</h2>";
}

document.getElementById("info").innerText =
  data.name + " • Account: " + data.account;

document.getElementById("amount").innerText =
  "₱ " + data.amount;

function pay() {
  localStorage.setItem("status", "paid");
  window.location.href = "success.html";
}

function cancel() {
  localStorage.setItem("status", "cancelled");
  window.location.href = "success.html";
}
</script>

</body>
</html>
