<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ISP Billing Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a, #1e3a8a, #0ea5e9);
    }

    .card {
      width: 380px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      color: white;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    h2 {
      margin: 10px 0 20px;
      font-size: 22px;
      font-weight: 700;
    }

    label {
      font-size: 12px;
      opacity: 0.8;
      display: block;
      margin-top: 12px;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 14px;
      background: rgba(255,255,255,0.15);
      color: white;
    }

    input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      margin-bottom: 10px;
    }

    .pay-method-title {
      margin-top: 18px;
      font-size: 13px;
      opacity: 0.85;
      text-align: center;
    }

    .payment-options {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 12px;
    }

    .pay-btn {
      border: none;
      background: rgba(255,255,255,0.15);
      padding: 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
      width: 130px;
      height: 70px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pay-btn:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,0.25);
    }

    .pay-btn img {
      max-width: 100%;
      max-height: 40px;
      object-fit: contain;
    }

    .footer {
      margin-top: 12px;
      font-size: 11px;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="badge">Secure Billing Portal</div>

  <div class="logo">MMR Network and Data Solution</div>
  <div class="subtitle">Fast • Reliable • Always Connected</div>

  <h2>Pay Your Internet Bill</h2>

  <label>Full Name</label>
  <input id="name" placeholder="Enter your registered name">

  <label>Account Number</label>
  <input id="account" placeholder="e.g. ISP-123456">

  <label>Amount (PHP)</label>
  <input id="amount" type="number" placeholder="0.00">

  <div class="pay-method-title">Pay via</div>

  <div class="payment-options">

    <button class="pay-btn" onclick="payNow('gcash')">
      <img src="https://getcash.ph/gcash/gcash-logo/" alt="GCash">
    </button>

    <button class="pay-btn" onclick="payNow('maya')">
      <img src="https://seeklogo.com/images/M/maya-logo-3F7A2A7D4F-seeklogo.com.png" alt="Maya">
    </button>

  </div>

  <div class="footer">
    Powered by Xendit
  </div>

</div>

<script>
function payNow(method) {
  const name = document.getElementById("name").value;
  const account = document.getElementById("account").value;
  const amount = document.getElementById("amount").value;

  if (!name || !account || !amount) {
    alert("Please complete all required fields.");
    return;
  }

  localStorage.setItem("payment", JSON.stringify({
    name,
    account,
    amount,
    method
  }));

  window.location.href = "gcash.html";
}
</script>

</body>
</html>
